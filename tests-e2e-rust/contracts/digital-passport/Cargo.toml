# NOTE: This crate's `lib.rs` was hand-imported from the external
# midnight-verifiable-credentials repo (commit 218d2c8) and is NOT
# regenerated by the `compactc --rust` pipeline — there is no
# `.compact` source for it in this repo and it is not listed in the
# `FIXTURES` table of `tests-e2e-rust/tests/codegen_regression.rs`.
# Consequently the Phase 7 assert-parity codegen change (assert →
# compact_assert!, pure circuits return Result<_, CompactError>) does
# NOT apply here: this lib.rs still carries 123 panicking `assert!`
# and its pure circuits do not return `Result`. To reach parity it
# must be regenerated from its upstream source repo with an updated
# `compactc --rust` and re-checked in. Until then it builds (plain
# `assert!` is valid Rust) but its assertion failures panic the host
# instead of returning a handleable `Err(CompactError::AssertionFailed)`.

[package]
name = "compact-contract-digital-passport"
version = "0.1.0"
edition = "2021"
publish = false
description = "Generated Rust crate for the midnight-verifiable-credentials digital-passport contract."

[lib]
name = "compact_contract_digital_passport"
path = "lib.rs"

[dependencies]
compact-runtime = { path = "../../../runtime-rs" }