[package]
name = "compact-rust-backend"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Typed Rust syntax backend for Compact"

[dependencies]
proc-macro2 = "1"
prettyplease = "0.2"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "parsing", "printing"] }
midnight-transient-crypto = "=2.0.1"
