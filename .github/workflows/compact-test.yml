name: Compact Tool Test

on:
  pull_request:
    paths:
      - "tools/compact/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTUP_TOOLCHAIN: 1.99.0
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Fast checks that can fail early
  pre-check:
    name: Pre-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable (branch)
        with:
          toolchain: 1.99.0

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache Cargo registry and git trees
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy -p compact --all-targets --all-features --locked -- -D warnings

  # Main test matrix
  test:
    name: Test
    permissions:
      contents: read
    needs: pre-check
    strategy:
      # want to see other results
      fail-fast: false
      max-parallel: 1
      matrix:
        os:
          - ubuntu-latest
          # ubuntu-latest-arm64
          - macos-15-intel
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable (branch)
        with:
          toolchain: 1.99.0

      - name: Install nextest
        uses: taiki-e/install-action@5e9ca9f228625a79b1cdac24184900b4ffc542ac # nextest (tag)

      - name: Cache Cargo registry and git trees
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-cargo-

      - name: Cache target directory
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-target-

      - name: Set up Python for verified fixture acquisition
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Test fixture acquisition guards
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tools/compact/tests/fixtures -p 'test_*.py'

      - name: Cache pinned compiler archives and counter parameters
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ${{ runner.temp }}/compact-compiler-fixtures
            ${{ runner.temp }}/compact-counter-parameters
          key: ${{ runner.os }}-${{ runner.arch }}-installer-fixtures-${{ hashFiles('tools/compact/tests/fixtures/compiler-archives.json', 'tools/compact/tests/fixtures/acquire_parameters.py') }}

      - name: Acquire and verify genuine compiler archives
        run: |
          python3 tools/compact/tests/fixtures/acquire_compilers.py \
            --platform auto --cache "$RUNNER_TEMP/compact-compiler-fixtures" \
            --receipt "$RUNNER_TEMP/compact-compiler-fixture-provenance.json"
          printf '%s\n' "COMPACT_TEST_ARCHIVE_CACHE=$RUNNER_TEMP/compact-compiler-fixtures" >> "$GITHUB_ENV"

      - name: Prepare exact historical counter public parameters
        run: |
          python3 tools/compact/tests/fixtures/acquire_parameters.py \
            --platform auto --archive-cache "$COMPACT_TEST_ARCHIVE_CACHE" \
            --cache "$RUNNER_TEMP/compact-counter-parameters" \
            --receipt "$RUNNER_TEMP/compact-counter-parameter-provenance.json"
          printf '%s\n' "MIDNIGHT_PP=$RUNNER_TEMP/compact-counter-parameters" >> "$GITHUB_ENV"

      - name: Cache pinned historical self-update assets
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/compact-self-update-assets
          key: ${{ runner.os }}-${{ runner.arch }}-self-update-fixtures-${{ hashFiles('tools/compact/tests/fixtures/self_update/manifest.json', 'tools/compact/tests/fixtures/self_update/acquire.py') }}

      - name: Acquire and verify historical self-update assets
        run: |
          python3 tools/compact/tests/fixtures/self_update/acquire.py \
            --output "$RUNNER_TEMP/compact-self-update-assets"
          printf '%s\n' "COMPACT_SELF_ASSETS_DIR=$RUNNER_TEMP/compact-self-update-assets" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build -p compact --locked

      - name: Run tests
        run: cargo nextest run -p compact --locked --no-fail-fast --test-threads=1

      - name: Retain installer fixture provenance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-fixture-provenance-${{ matrix.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/compact-compiler-fixture-provenance.json
            ${{ runner.temp }}/compact-counter-parameter-provenance.json
            ${{ runner.temp }}/compact-self-update-assets/receipt.json
          if-no-files-found: warn
