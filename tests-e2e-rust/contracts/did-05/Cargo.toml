# Compile-gate + byte-parity fixture for the midnight-did 0.5.0 contract
# (controller-authorization + recovery redesign). The `.compact` source is
# vendored under `examples/did-05/` (did.compact + its jubjub-schnorr
# dependency, preserving the `../../jubjub-schnorr/src/schnorr` relative
# import); `lib.rs` is regenerated by `compactc --rust --skip-zk` and
# checked against this crate by the `FIXTURES` table in
# `tests-e2e-rust/tests/codegen_regression.rs`. Being a workspace member
# means `cargo build` also compile-checks the generated code — the
# end-to-end guard that the 0.5.0-specific codegen paths (JubjubPoint
# decoder/default, ctor-mode impure calls, multi-assert branches) keep
# producing code that compiles against compact-runtime.

[package]
workspace = "../../../runtime-rs"
name = "compact-contract-did-05"
version = "0.1.0"
edition = "2021"
publish = false
description = "Generated Rust crate for the midnight-did 0.5.0 did.compact contract, used by tests-e2e-rust byte-parity + compile gates."

[lib]
name = "compact_contract_did_05"
path = "lib.rs"

[dependencies]
compact-runtime = { path = "../../../runtime-rs" }
