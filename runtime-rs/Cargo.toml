[package]
name = "midnight-compact-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Native Compact semantics on Midnight ledger primitives"
repository = "https://github.com/MediaNoxLabs/compact"
homepage = "https://github.com/MediaNoxLabs/compact"
readme = "README.md"
include = ["Cargo.toml", "LICENSE", "README.md", "src/**", "tests/**"]

[features]
ledger-transaction = ["dep:midnight-ledger"]

[dependencies]
midnight-compact-runtime-macros = { version = "=0.1.0", path = "../runtime-rs-macros" }
# Exact crates published with midnight-ledger's ledger-8.0.3 tag. They share
# representation and VM APIs; minor-version mixing has already broken the VM.
midnight-base-crypto = "=1.0.0"
midnight-coin-structure = "=2.0.1"
midnight-onchain-runtime = "=3.0.0"
midnight-onchain-state = "=3.0.0"
midnight-onchain-vm = "=3.0.0"
midnight-serialize = "=1.0.0"
midnight-storage = "=2.0.1"
midnight-storage-core = "=1.1.0"
midnight-transient-crypto = "=2.0.1"

# The matching midnight-zk graph from ledger-8.0.3's Cargo.lock.
midnight-circuits = "=6.0.0"
midnight-curves = "=0.2.0"
midnight-proofs = "=0.7.0"
midnight-zk-stdlib = "=1.0.0"
midnight-zswap = "=8.0.3"
midnight-ledger = { version = "=8.0.3", optional = true }
sha3 = "=0.10.8"

[dev-dependencies]
hex = "0.4"
midnight-ledger = "=8.0.3"
serde = "1"
serde_json = "1"
