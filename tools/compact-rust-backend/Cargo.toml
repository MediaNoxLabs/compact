[package]
name = "compact-rust-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Typed Rust syntax backend for Compact"
repository = "https://github.com/MediaNoxLabs/compact"
homepage = "https://github.com/MediaNoxLabs/compact"
readme = "README.md"
include = ["Cargo.toml", "README.md", "src/**", "tests/**", "fixtures/**"]

[dependencies]
proc-macro2 = "1"
prettyplease = "0.2"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "parsing", "printing", "visit-mut"] }
toml_edit = "0.22"
midnight-transient-crypto = "=2.0.1"
