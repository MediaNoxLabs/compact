name: Rust runtime + e2e tests

# CI for the `compactc --rust` Rust side: `midnight-compact-runtime` (the runtime
# crate generated contract code depends on) and `tests-e2e-rust` (the
# cross-language byte-parity test crate). The compiler's own Scheme
# tests live in build-compiler.yml.
#
# Three jobs:
#  - pre-check:                   fmt + clippy on the whole workspace (fast, ~3 min).
#  - byte-parity-compiler-backed: Linux lane that builds compactc via Nix and runs
#                                 the FULL tests-e2e-rust suite, so the byte-parity
#                                 + rejection-corpus gates actually execute.
#  - test:                        cargo test on Linux + macOS, without Nix.
#
# The `codegen_regression` byte-parity test and the `rust_backend_*`
# rejection corpus both require a built compactc and FAIL (do not skip)
# when one is absent — a skip would report a green gate that regenerated
# nothing. Only `byte-parity-compiler-backed` builds compactc, so it runs
# them with no `--skip` flags; the `test` matrix legs have no Nix and
# therefore exclude those tests BY NAME rather than relying on an in-test
# escape hatch. Keeping the exclusion at the call site makes the omission
# visible in the step below and in libtest's "filtered out" count, and
# guarantees that any run which does execute them had a real compiler.
#
# Follow-up (MediaNoxLabs/compact#23): build compactc once in
# build-compiler.yml and share the artifact with this lane via
# `workflow_run`, instead of paying the Nix build per PR here.
#
# Trigger paths include the WHOLE `compiler/**` tree, not an enumerated subset
# of pass files. Any compiler input can change emitted Rust — the pass chain is
# frontend-passes -> analysis-passes / circuit-passes / config-params -> the
# rust-passes-*.ss emitters, and the natives feed the emitter — so naming only
# some files silently skipped this lane for changes to the ones it omitted.
# Listing the tree keeps the byte-parity gate impossible to bypass by editing an
# unlisted compiler source.

on:
  pull_request:
    paths:
      - "runtime-rs/**"
      - "runtime-rs-macros/**"
      - "tests-e2e-rust/**"
      # The whole compiler tree: see the trigger-paths note in the header.
      - "compiler/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-runtime-test.yml"
  push:
    branches:
      - main
    paths:
      - "runtime-rs/**"
      - "runtime-rs-macros/**"
      - "tests-e2e-rust/**"
      # The whole compiler tree: see the trigger-paths note in the header.
      - "compiler/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/rust-runtime-test.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10

jobs:
  # Fast pre-checks that can fail early — no Nix, no compactc.
  pre-check:
    name: Format + Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable (branch)

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache Cargo registry and git trees
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # `cargo fmt --all --check` formats every workspace member — our
      # crates AND each generated `tests-e2e-rust/contracts/*` fixture crate.
      # The fixture coverage matters: registered fixtures are already fmt-
      # gated by codegen_regression (it regenerates with the nix rustfmt and
      # asserts byte-identity), but any fixture crate that is NOT registered
      # in the FIXTURES table is only caught here. Formatting is hermetic
      # (no network), and this is the
      # nix-nightly rustfmt the emitter's post-pass hook uses, so it is the
      # authoritative fmt gate for the repo. `--all` includes tools/compact
      # too — harmless, that tree is fmt-clean.
      - name: Check formatting (whole workspace)
        run: cargo fmt --all --check

      # Clippy with -D warnings turns lints into errors. We scope it to
      # our crates explicitly so changes to tools/compact don't
      # accidentally start gating on this workflow.
      - name: Run Clippy on midnight-compact-runtime
        run: cargo clippy -p midnight-compact-runtime --all-targets --all-features -- -D warnings

      - name: Run Clippy on midnight-compact-runtime-macros
        run: cargo clippy -p midnight-compact-runtime-macros --all-targets --all-features -- -D warnings

      - name: Run Clippy on tests-e2e-rust
        run: cargo clippy -p tests-e2e-rust --all-targets --all-features -- -D warnings

  # Compiler-backed gate — the only CI lane with BOTH a built compactc and a
  # Rust toolchain, so the byte-parity and rejection-corpus tests that the
  # `test` matrix must exclude by name actually execute here. It passes no
  # `--skip` flags: a run that filtered those tests out would defeat the lane.
  byte-parity-compiler-backed:
    name: Byte-parity (compiler-backed)
    needs: pre-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # `nix build .#compactc` is ~11 min with the Attic cache and 90+ min cold
    # (see build-compiler.yml); this budget covers the cold case.
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Nix with cache
        uses: ./.github/actions/setup-nix-cache
        with:
          attic_token: ${{ secrets.ATTIC_CACHE_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable (branch)

      # The emitter pipes freshly generated lib.rs through rustfmt; without it
      # the committed (formatted) bytes and the regenerated bytes differ and the
      # byte-parity gate reports false drift. `dtolnay/rust-toolchain` alone
      # does not install the component (pre-check adds it explicitly too).
      - name: Install Rust formatting component
        run: rustup component add rustfmt

      - name: Cache Cargo registry and git trees
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target directory
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: ${{ runner.os }}-target-byte-parity-${{ hashFiles('Cargo.lock', 'runtime-rs/**', 'runtime-rs-macros/**', 'tests-e2e-rust/**') }}
          restore-keys: |
            ${{ runner.os }}-target-byte-parity-
            ${{ runner.os }}-target-rust-runtime-

      - name: Build compactc
        run: nix build .#compactc

      - name: Build tests-e2e-rust (incl. fixture crates)
        run: cargo build -p tests-e2e-rust --tests --locked

      - name: Integration tests — tests-e2e-rust (compiler-backed)
        # No `--skip` here: `nix build .#compactc` put a real compiler at
        # ./result/bin/compactc, so `codegen_regression`'s byte-parity gate and
        # the `rust_backend_*` rejection corpus run rather than being filtered
        # out. The `test` matrix keeps the skips because it has no Nix.
        run: cargo test -p tests-e2e-rust --locked

  # Test matrix — runs the platform-independent part of the suite on Linux
  # and macOS to catch platform-dependent encoding bugs. Neither leg has Nix,
  # so both exclude the compactc-backed gates by name; those run in
  # `byte-parity-compiler-backed`.
  test:
    name: Test ${{ matrix.os }}
    needs: pre-check
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable (branch)

      - name: Cache Cargo registry and git trees
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target directory
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: ${{ runner.os }}-target-rust-runtime-${{ hashFiles('Cargo.lock', 'runtime-rs/**', 'runtime-rs-macros/**', 'tests-e2e-rust/**') }}
          restore-keys: |
            ${{ runner.os }}-target-rust-runtime-

      - name: Build midnight-compact-runtime
        run: cargo build -p midnight-compact-runtime --locked

      - name: Build tests-e2e-rust (incl. fixture crates)
        run: cargo build -p tests-e2e-rust --tests --locked

      - name: Unit tests — midnight-compact-runtime
        run: cargo test -p midnight-compact-runtime --locked

      - name: Integration tests — tests-e2e-rust
        # Two gates here drive compactc directly and so hard-fail without a
        # compiler: `rust_codegen_byte_parity_against_committed_fixtures`
        # regenerates every fixture and asserts byte-identity, and the
        # `rust_backend_*` rejection corpus compiles probe contracts and
        # asserts they are refused. These are bare Ubuntu/macOS runners with
        # no nix build, so both are excluded by name; everything else in
        # tests-e2e-rust still gates here. The compiler-backed counterparts
        # of these two gates run in `byte-parity-compiler-backed`, which does
        # build compactc.
        #
        # Excluding at the call site rather than skipping inside the tests
        # keeps them impossible to pass vacuously: neither has a skip path of
        # its own, so any run that does execute them had a real compiler.
        run: cargo test -p tests-e2e-rust --locked -- --skip rust_codegen_byte_parity --skip rust_backend_
