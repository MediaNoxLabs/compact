[package]
name = "compact-rust-proof-smoke"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Ledger-8 proof compatibility gate for Rust Compact output"

[dependencies]
# Match midnight-ledger ledger-8.0.3's ZKIR and crypto graph.
compact-rust-counter-fixture = { path = "../../tests-rust-backend/counter", features = ["ledger-transaction"] }
compact-rust-counter-parameter-fixture = { path = "../../tests-rust-backend/counter-parameter", features = ["ledger-transaction"] }
compact-rust-uints-oracle-fixture = { path = "../../tests-rust-backend/uints-oracle", features = ["ledger-transaction"] }
compact-rust-wide-uint-oracle-fixture = { path = "../../tests-rust-backend/wide-uint-oracle", features = ["ledger-transaction"] }
compact-rust-cell-boolean-fixture = { path = "../../tests-rust-backend/cell-boolean" }
compact-rust-cell-struct-fixture = { path = "../../tests-rust-backend/cell-struct", features = ["ledger-transaction"] }
compact-rust-cell-read-fixture = { path = "../../tests-rust-backend/cell-read" }
compact-rust-set-boolean-fixture = { path = "../../tests-rust-backend/set-boolean" }
compact-rust-set-oracle-fixture = { path = "../../tests-rust-backend/set-oracle" }
compact-rust-map-boolean-field-fixture = { path = "../../tests-rust-backend/map-boolean-field", features = ["ledger-transaction"] }
compact-rust-nested-map-shape-fixture = { path = "../../tests-rust-backend/nested-map-shape" }
compact-rust-constructor-map-actions-fixture = { path = "../../tests-rust-backend/constructor-map-actions" }
compact-rust-list-field-fixture = { path = "../../tests-rust-backend/list-field" }
compact-rust-witness-list-shapes-fixture = { path = "../../tests-rust-backend/witness-list-shapes" }
compact-rust-constructor-list-actions-fixture = { path = "../../tests-rust-backend/constructor-list-actions" }
compact-rust-tiny-oracle-fixture = { path = "../../tests-rust-backend/tiny-oracle" }
compact-rust-merkle-tree-oracle-fixture = { path = "../../tests-rust-backend/merkle-tree-oracle" }
compact-rust-hmt-insert-oracle-fixture = { path = "../../tests-rust-backend/hmt-insert-oracle" }
compact-rust-vector-key-adt-fixture = { path = "../../tests-rust-backend/vector-key-adt" }
compact-rust-observed-composite-keys-fixture = { path = "../../tests-rust-backend/observed-composite-keys", features = ["ledger-transaction"] }
compact-rust-chunked-set-observed-fixture = { path = "../../tests-rust-backend/chunked-set-observed", features = ["ledger-transaction"] }
compact-rust-chunked-list-fixture = { path = "../../tests-rust-backend/chunked-list", features = ["ledger-transaction"] }
compact-rust-chunked-map-fixture = { path = "../../tests-rust-backend/chunked-map", features = ["ledger-transaction"] }
compact-rust-chunked-cell-fixture = { path = "../../tests-rust-backend/chunked-cell", features = ["ledger-transaction"] }
compact-rust-recorded-enum-cell-fixture = { path = "../../tests-rust-backend/recorded-enum-cell" }
compact-rust-witness-cell-write-fixture = { path = "../../tests-rust-backend/witness-cell-write", features = ["ledger-transaction"] }
compact-rust-stateful-circuit-call-fixture = { path = "../../tests-rust-backend/stateful-circuit-call", features = ["ledger-transaction"] }
compact-rust-nested-witness-call-oracle-fixture = { path = "../../tests-rust-backend/nested-witness-call-oracle" }
midnight-compact-runtime = { path = "../../runtime-rs", features = ["ledger-transaction"] }
midnight-ledger = "=8.0.3"
midnight-onchain-state = "=3.0.0"
midnight-onchain-runtime = "=3.0.0"
midnight-onchain-vm = "=3.0.0"
midnight-storage = "=2.0.1"
midnight-zkir = "=2.1.0"
midnight-serialize = "=1.0.0"
midnight-transient-crypto = "=2.0.1"
midnight-base-crypto = "=1.0.0"
midnight-circuits = "=6.0.0"
midnight-curves = "=0.2.0"
midnight-proofs = "=0.7.0"
midnight-zk-stdlib = "=1.0.0"
midnight-storage-core = "=1.1.0"
rand = "=0.8.5"
rand_chacha = "=0.3.1"
futures-executor = "=0.3.32"
