[package]
name = "compact-rust-adt-list-enum-fixture"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Compact keeps the source's explicit Boolean assertions in generated Rust.
[lints.clippy]
bool_comparison = "allow"

[lib]
path = "lib.rs"

[features]
ledger-transaction = ["midnight-compact-runtime/ledger-transaction"]

[dependencies]
midnight-compact-runtime = { path = "../../runtime-rs" }

[dev-dependencies]
hex = "0.4"
serde = "1"
serde_json = "1"
midnight-onchain-state = "=3.0.0"
midnight-serialize = "=1.0.0"
midnight-storage = "=2.0.1"
