[workspace]
resolver = "3"
members = ["tools/*", "runtime-rs", "runtime-rs-macros", "tests-rust-backend/identity", "tests-rust-backend/truth", "tests-rust-backend/one-tuple", "tests-rust-backend/field-add", "tests-rust-backend/field-arithmetic", "tests-rust-backend/transient-hash", "tests-rust-backend/persistent-hash", "tests-rust-backend/keccak", "tests-rust-backend/assert-pure", "tests-rust-backend/assert-witness", "tests-rust-backend/equality", "tests-rust-backend/boolean-logic", "tests-rust-backend/uint-compare", "tests-rust-backend/vector-tuple-cell", "tests-rust-backend/stateful-pure-call", "tests-rust-backend/jubjub-hash", "tests-rust-backend/jubjub-arithmetic", "tests-rust-backend/jubjub-construct", "tests-rust-backend/jubjub-cell", "tests-rust-backend/witness-jubjub", "tests-rust-backend/witness-hash", "tests-rust-backend/uint-identity", "tests-rust-backend/uint-arithmetic", "tests-rust-backend/witness-minimal", "tests-rust-backend/witness-argument", "tests-rust-backend/witness-ledger-cell", "tests-rust-backend/witness-ledger-counter", "tests-rust-backend/witness-ledger-set", "tests-rust-backend/witness-ledger-map", "tests-rust-backend/witness-ledger-list", "tests-rust-backend/witness-field-expression", "tests-rust-backend/witness-cell-write", "tests-rust-backend/map-literal", "tests-rust-backend/witness-conditional", "tests-rust-backend/witness-uint-arithmetic", "tests-rust-backend/bytes-identity", "tests-rust-backend/counter", "tests-rust-backend/cell-boolean", "tests-rust-backend/struct-identity", "tests-rust-backend/nested-struct", "tests-rust-backend/enum-identity", "tests-rust-backend/composite-struct", "tests-rust-backend/cell-struct", "tests-rust-backend/cell-enum", "tests-rust-backend/cell-parameter", "tests-rust-backend/counter-parameter", "tests-rust-backend/cell-read", "tests-rust-backend/set-boolean", "tests-rust-backend/map-boolean-field", "tests-rust-backend/list-field", "tests-rust-backend/choose-field"]

[workspace.package]
version = "0.5.1"
authors = ["Midnight Foundation"]
edition = "2024"
rust-version = "1.88.0"
description = "Manages multiple versions of the compact toolchain"
homepage = "https://docs.midnight.network"
repository = "https://github.com/midnightntwrk/compact"
license = "Apache-2.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
