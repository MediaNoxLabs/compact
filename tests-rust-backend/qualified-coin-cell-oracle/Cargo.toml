[package]
name = "compact-rust-qualified-coin-cell-oracle-fixture"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lints.clippy]
bool_comparison = "allow"

[lib]
path = "lib.rs"

[features]
ledger-transaction = ["midnight-compact-runtime/ledger-transaction"]

[dependencies]
midnight-compact-runtime = { path = "../../runtime-rs" }

[dev-dependencies]
hex = "0.4"
serde = "1"
serde_json = "1"
midnight-base-crypto = { version = "=1.0.2", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a" }
midnight-coin-structure = { version = "=2.0.2", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a" }
midnight-onchain-state = { version = "=3.0.2", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a" }
midnight-serialize = { version = "=1.1.1", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a" }
midnight-storage = { version = "=2.0.3", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a" }

[build-dependencies]
compact-rust-backend = { path = "../../tools/compact-rust-backend" }
serde_json = "1"
