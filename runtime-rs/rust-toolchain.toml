# `runtime-rs' is a separate cargo workspace from the `compact' CLI, and it
# needs a newer toolchain than the CLI's MSRV pin at the repository root.
#
# The root ../rust-toolchain.toml pins 1.88.0 - the CLI's declared MSRV - and
# cargo applies the nearest toolchain file, so without this one the CLI's pin
# would govern this workspace too. It cannot: the dependency tree reached
# through midnight-ledger requires more.
#
#   konst 0.4.3            requires 1.89.0
#   konst_proc_macros      requires 1.89.0
#   sysinfo 0.39.6         requires 1.95
#
# Those arrive transitively from the pinned midnight-ledger tag, so they are
# not ours to choose. Raise this pin when the ledger tag moves, and drop the
# file entirely if the CLI's MSRV ever catches up.
[toolchain]
channel = "1.95.0"
components = ["clippy", "rustfmt"]
