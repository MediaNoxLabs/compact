name: Compact Tool Test

on:
  pull_request:
    # This workflow exercises the `tools/compact` toolchain-manager CLI, so
    # it triggers on changes to that tool. It deliberately does NOT trigger
    # on every `.github/workflows/**` change: its integration tests query the
    # live compact release channel and assert the current latest version
    # (tests/common/mod.rs `LATEST_COMPACTC_VERSION`), so running them on
    # unrelated PRs (e.g. compiler / Rust-codegen work) just couples those
    # PRs to an external, release-cadence-driven value they don't touch.
    paths:
      - "tools/compact/**"
      # `tools/compact` is a member of the ROOT workspace and inherits
      # version / edition / rust-version from `[workspace.package]`, so its
      # build depends on files outside its own directory. Without these, a
      # change to the root manifest or lockfile that breaks this crate's
      # dependency resolution does not trigger the job that would catch it —
      # the breakage then surfaces on some later, unrelated contributor's PR,
      # where it looks like their fault.
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Fast checks that can fail early
  pre-check:
    name: Pre-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable (branch)

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache Cargo registry and git trees
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Main test matrix
  test:
    name: Test
    permissions:
      contents: read
    needs: pre-check
    strategy:
      # want to see other results
      fail-fast: false
      max-parallel: 1
      matrix:
        os:
          - ubuntu-latest
          # ubuntu-latest-arm64
          - macos-15
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable (branch)

      - name: Install nextest
        uses: taiki-e/install-action@5e9ca9f228625a79b1cdac24184900b4ffc542ac # nextest (tag)

      - name: Cache Cargo registry and git trees
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target directory
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo nextest run --no-fail-fast --test-threads=1
