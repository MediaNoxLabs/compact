name: Ledger Line Check

# Fork-local gate. Upstream (LFDT-Minokawa/compact) tracks a single ledger
# line, so this workflow must NOT be carried into the curated upstream PR
# — see MediaNoxLabs/compact#22.
#
# This fork maintains two ledger lines simultaneously:
#
#   codegen-rust  (stable)  → ledger 8, via either published crates or one
#                             reviewed immutable Ledger8 revision. The latter
#                             is required while a compatible zswap prerelease
#                             has not been published.
#   develop       (forward) → ledger 9, via git tags on midnightntwrk/
#                             midnight-ledger (ledger-9.x). Unreleased;
#                             becomes the stable line once ledger 9 ships.
#
# The split is easy to violate by merge: a ledger-9 pin reaching
# codegen-rust would silently make the "stable" branch depend on an
# unreleased ledger, and nothing else in CI would notice — the Rust
# tests pass either way. This job turns that convention into an
# enforced invariant.
#
# Both manifest and lockfile are checked. Cargo.toml states intent;
# Cargo.lock is what actually gets built, and it also captures TRANSITIVE
# git pins that no [workspace.dependencies] entry mentions.

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ledger-line-check.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-ledger-line:
    name: Ledger line matches base branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Assert the ledger line matches the branch policy
        env:
          # base_ref is the PR target and is EMPTY for workflow_dispatch,
          # so fall back to the branch the run was dispatched on. Without
          # the fallback a manual run matched no policy and reported
          # success having checked nothing.
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          branch="${BASE_REF:-$REF_NAME}"
          if [ -z "$branch" ]; then
            echo "::error::could not determine a branch to apply ledger policy to (base_ref and ref_name both empty)"
            exit 1
          fi
          echo "Event '$EVENT' → applying the ledger-line policy for '$branch'"

          # --- manifest: declared intent -------------------------------
          # Strip comment lines first: a commented-out `# tag = "ledger-9"`
          # must not trip the policy. Only [workspace.dependencies]-style
          # ledger- tags count; [patch.crates-io] carries unrelated tags
          # such as transient-crypto-2.2.0-rc.1.
          manifest_majors=$(grep -vE '^\s*#' Cargo.toml \
            | grep -oE 'tag = "ledger-[0-9]+' \
            | grep -oE '[0-9]+$' | sort -u || true)

          # --- lockfile: what actually builds --------------------------
          # Ground truth, and the only place a transitive git pin shows up.
          lock_ledger_srcs=$(grep -oE 'git\+https://github\.com/(midnightntwrk|MediaNoxLabs)/midnight-ledger[^"]*' Cargo.lock | sort -u || true)
          lock_majors=$(printf '%s\n' "$lock_ledger_srcs" \
            | grep -oE 'tag=ledger-[0-9]+' \
            | grep -oE '[0-9]+$' | sort -u || true)

          fail() { echo "::error::$1"; shift; printf '%s\n' "$@" >&2; exit 1; }

          case "$branch" in
            codegen-rust)
              stable_git_rev="30fd606e5652d9146e8c7d453c5c01ea03962a89"
              if [ -n "$manifest_majors" ]; then
                fail \
                  "codegen-rust is the ledger 8 stable branch, but Cargo.toml declares git tag pins for ledger $(echo "$manifest_majors" | tr '\n' ' ')." \
                  "codegen-rust accepts published Ledger8 crates or the reviewed immutable Ledger8 revision, not tag pins." \
                  "" "Offending pins:" "$(grep -nE 'tag = "ledger-' Cargo.toml)" "" \
                  "A ledger 9 dependency belongs on develop, not on the stable branch."
              fi

              if [ -z "$lock_ledger_srcs" ]; then
                if ! grep -qE '^midnight-zswap\s*=\s*"8"' Cargo.toml; then
                  fail "codegen-rust expects midnight-zswap = \"8\" when using published Ledger8 crates." \
                       "Found: $(grep -nE '^midnight-zswap' Cargo.toml || echo '(no midnight-zswap entry)')"
                fi
                echo "✓ codegen-rust: ledger 8 — published crates"
                exit 0
              fi

              if printf '%s\n' "$lock_ledger_srcs" | grep -qv "?rev=${stable_git_rev}"; then
                fail \
                  "codegen-rust resolved an unreviewed midnight-ledger Git revision." \
                  "Expected revision: $stable_git_rev" \
                  "Resolved git sources:" "$lock_ledger_srcs" "" \
                  "Update the reviewed stable revision deliberately before changing this allow-list."
              fi

              manifest_git_count=$(grep -cE '^midnight-(base-crypto|transient-crypto|serialize|storage|coin-structure|onchain-state|onchain-vm|onchain-runtime|zswap)\s*=.*git = "https://github.com/MediaNoxLabs/midnight-ledger.git".*rev = "'"$stable_git_rev"'"' Cargo.toml || true)
              if [ "$manifest_git_count" -ne 9 ]; then
                fail "codegen-rust must pin the complete nine-crate Ledger8 cone to one reviewed revision; found $manifest_git_count entries." \
                     "$(grep -nE '^midnight-(base-crypto|transient-crypto|serialize|storage|coin-structure|onchain-state|onchain-vm|onchain-runtime|zswap)' Cargo.toml)"
              fi
              if ! grep -qE '^midnight-zswap\s*=.*version = "=8\.2\.0-rc\.1"' Cargo.toml; then
                fail "the reviewed immutable Ledger8 cone expects midnight-zswap =8.2.0-rc.1." \
                     "Found: $(grep -nE '^midnight-zswap' Cargo.toml || echo '(no midnight-zswap entry)')"
              fi
              echo "✓ codegen-rust: ledger 8 — one reviewed immutable source at $stable_git_rev"
              ;;
            develop)
              if [ -z "$manifest_majors" ] && [ -z "$lock_majors" ]; then
                echo "✓ develop: no ledger git pins yet — still on the published ledger 8 line (pre-ledger-9 merge)"
                exit 0
              fi
              for majors in "$manifest_majors" "$lock_majors"; do
                if [ -n "$majors" ] && [ "$majors" != "9" ]; then
                  fail \
                    "develop is the ledger 9 forward branch, but a ledger $(echo "$majors" | tr '\n' ' ') pin is present." \
                    "All ledger- pins on develop must be on the same major line (9)." \
                    "" "Manifest:" "$(grep -nE 'tag = \"ledger-' Cargo.toml || true)" \
                    "" "Lockfile:" "$lock_ledger_srcs"
                fi
              done
              echo "✓ develop: ledger 9 — manifest and lockfile agree on a single major"
              ;;
            *)
              echo "No ledger-line policy for branch '$branch' — nothing to check."
              echo "(main mirrors LFDT-Minokawa upstream and follows whatever it pins.)"
              ;;
          esac
