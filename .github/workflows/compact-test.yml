name: Compact Tool Test

on:
  pull_request:
    paths:
      - "tools/compact/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Fast checks that can fail early
  pre-check:
    name: Pre-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable (branch)

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache Cargo registry and git trees
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('tools/compact/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Main test matrix
  #
  # Skipped on the yshyn-iohk/compact fork. These are integration tests for
  # the `tools/compact` toolchain-*manager* CLI (install/update/list/check
  # subcommands), unrelated to the Rust codegen work this fork carries. They
  # are non-hermetic: they query the live compact release channel and assert
  # against a hardcoded "Latest version available" string, so they fail
  # whenever upstream publishes a new release (currently the channel returns
  # 0.31.1 while the goldens expect 0.31.0 — 42/42 failures are this single
  # drift). The fork cannot pin the remote, and the tooling is not ours to
  # maintain. The `pre-check` job above (host-stable `cargo fmt --all` +
  # `cargo clippy --all` over the whole workspace) still runs on the fork and
  # gates every crate including our fixtures. Runs unchanged upstream
  # (LFDT-Minokawa) and on any other fork.
  test:
    name: Test
    if: github.repository != 'yshyn-iohk/compact'
    permissions:
      contents: read
    needs: pre-check
    strategy:
      # want to see other results
      fail-fast: false
      max-parallel: 1
      matrix:
        os:
          - ubuntu-latest
          # ubuntu-latest-arm64
          - macos-15
          - macos-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable (branch)

      - name: Install nextest
        uses: taiki-e/install-action@5e9ca9f228625a79b1cdac24184900b4ffc542ac # nextest (tag)

      - name: Cache Cargo registry and git trees
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('tools/compact/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache target directory
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: tools/compact/target
          key: ${{ runner.os }}-target-${{ hashFiles('tools/compact/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo nextest run --no-fail-fast --test-threads=1
