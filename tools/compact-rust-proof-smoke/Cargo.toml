[package]
name = "compact-rust-proof-smoke"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Ledger-8 proof compatibility gate for Rust Compact output"

[dependencies]
# Match midnight-ledger ledger-8.0.2's ZKIR and crypto graph.
midnight-zkir = "=2.1.0"
midnight-serialize = "=1.0.0"
midnight-transient-crypto = "=2.0.1"
midnight-base-crypto = "=1.0.0"
midnight-circuits = "=6.0.0"
midnight-curves = "=0.2.0"
midnight-proofs = "=0.7.0"
midnight-zk-stdlib = "=1.0.0"
midnight-storage-core = "=1.0.2"
rand = "=0.8.5"
rand_chacha = "=0.3.1"
futures-executor = "=0.3.32"
