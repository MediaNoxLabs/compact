[package]
name = "midnight-compact-runtime-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Derived ledger FAB codecs for generated Compact Rust types"
repository = "https://github.com/MediaNoxLabs/compact"
homepage = "https://github.com/MediaNoxLabs/compact"
readme = "README.md"
include = ["Cargo.toml", "LICENSE", "README.md", "src/**"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
