[package]
name = "compact-rust-jubjub-scalar-cell-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false
[lib]
path = "lib.rs"
[features]
ledger-transaction = ["midnight-compact-runtime/ledger-transaction"]
[dependencies]
midnight-compact-runtime = { path = "../../runtime-rs" }
[dev-dependencies]
midnight-compact-testkit = { path = "../../testkit-rs" }
midnight-serialize = { version = "=1.1.1", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a" }
midnight-onchain-vm = { version = "=3.1.2", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a" }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
