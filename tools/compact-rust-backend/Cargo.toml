[package]
name = "compact-rust-backend"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Typed Rust syntax backend for Compact"
repository = "https://github.com/MediaNoxLabs/compact"
homepage = "https://github.com/MediaNoxLabs/compact"
readme = "README.md"
include = ["Cargo.toml", "README.md", "src/**", "tests/**", "examples/**", "fixtures/**", "recording_admission_inventory.encoding-583.json", "recording_admission_inventory.resource-diagnostics-597.json"]

[features]
# Compatibility switch retained for prototype property/resource test cohorts.
# ADR0371 / #511: Effectful recording admission uses checked plans by default.
experimental-recording-plan = []

[dependencies]
fs2 = "=0.4.3"
proc-macro2 = "1"
prettyplease = "0.2"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "parsing", "printing", "visit-mut"] }
toml_edit = "0.22"
midnight-transient-crypto = { version = "=2.1.1", git = "https://github.com/midnightntwrk/midnight-ledger", rev = "b5d3e965a18e4cac17fac4f38446fc55c524439a" }

# Use the exact identifier tables already present in the locked syntax stack.
unicode-ident = "=1.0.24"
